services:
  - type: web
    name: eva-bharat-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .          # relative to rootDir (backend/)
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PORT
        value: "8080"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false           # Set manually in Render dashboard (Supabase connection string)
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # Set manually: https://YOUR-SITE.netlify.app
